<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhysPy Reports</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 28px 32px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        color: #f8fafc;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #94a3b8;
        font-size: 14px;
      }
      code {
        background: #0f172a;
        padding: 2px 6px;
        border-radius: 4px;
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>PhysPy Published Reports</h1>
      <p>
        This host serves static HTML notebook reports published directly from the PhysPy editor.
        Open a shared link in the form <code>/r/&lt;reportId&gt;</code> to view a report.
      </p>
    </main>
  </body>
</html>
